name: Production CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. FAST LINTING CHECK
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Code Quality (ESLint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

  # ---------------------------------------------------------------------------
  # 2. LOCAL AI REVIEW (Runs in Parallel with Caching)
  # ---------------------------------------------------------------------------
  ai-code-review:
    name: AI PR Code Reviewer
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install & Run Ollama
        run: |
          curl -fsSL [https://ollama.com/install.sh](https://ollama.com/install.sh) | sh
          ollama serve &
          sleep 4
          ollama pull llama3.2:1b

      - name: Generate Inline Code Suggestions
        run: node scripts/ai-pr-reviewer.js

      - name: Post Inline Suggestions to PR
        uses: actions/github-script@v7
        if: always()
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            if (!fs.existsSync('pr_comments.json')) return;

            const comments = JSON.parse(fs.readFileSync('pr_comments.json', 'utf8'));
            if (!comments || comments.length === 0) {
              console.log('No inline comments to post.');
              return;
            }

            // Post a structured PR Review with inline line comments
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              event: 'COMMENT',
              comments: comments
            });
  # ---------------------------------------------------------------------------
  # 3. INTEGRATION TESTS (Runs in Parallel)
  # ---------------------------------------------------------------------------
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: app_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Integration Tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/app_test
        run: npm run test:integration

  # ---------------------------------------------------------------------------
  # 4. CONTAINER BUILD (Runs only after all 3 quality checks pass)
  # ---------------------------------------------------------------------------
  build-container:
    name: Build & Cache Docker Image
    needs: [quality-gate, ai-code-review, integration-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (dry-run with cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: app/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

permissions:
  contents: read
  pull-requests: write
  issues: write