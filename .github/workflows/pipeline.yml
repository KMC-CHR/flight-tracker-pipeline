name: Production CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. FAST LINTING CHECK
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Code Quality (ESLint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

  # ---------------------------------------------------------------------------
  # 2. LOCAL AI REVIEW (Runs in Parallel with Caching)
  # ---------------------------------------------------------------------------
  ai-code-review:
    name: Local SLM Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Ollama Executable and Model
        id: cache-ollama
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-model-llama3.2-1b

      - name: Install & Run Ollama
        run: |
          if [ ! -f /usr/local/bin/ollama ]; then
            curl -fsSL https://ollama.com/install.sh | sh
          fi
          ollama serve &
          sleep 3
          ollama pull llama3.2:1b

      - name: Execute SLM Diff Audit
        run: node scripts/ai-audit.js

  # ---------------------------------------------------------------------------
  # 3. INTEGRATION TESTS (Runs in Parallel)
  # ---------------------------------------------------------------------------
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: app_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Integration Tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/app_test
        run: npm run test:integration

  # ---------------------------------------------------------------------------
  # 4. CONTAINER BUILD (Runs only after all 3 quality checks pass)
  # ---------------------------------------------------------------------------
  build-container:
    name: Build & Cache Docker Image
    needs: [quality-gate, ai-code-review, integration-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (dry-run with cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: app/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

permissions:
  contents: read
  pull-requests: write
  issues: write